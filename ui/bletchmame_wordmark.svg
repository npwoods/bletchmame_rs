<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">BletchMAME</title>
  <desc id="desc">The BletchMAME wordmark in a blue and purple metallic gradient.</desc>
  <defs>
    <linearGradient id="wordmark-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e7ff"/>
      <stop offset=".12" stop-color="#a9b9ff"/>
      <stop offset=".24" stop-color="#6684e6"/>
      <stop offset=".43" stop-color="#4a52c5"/>
      <stop offset=".58" stop-color="#8c4bd2"/>
      <stop offset=".76" stop-color="#b83cbd"/>
      <stop offset="1" stop-color="#512b9d"/>
    </linearGradient>
    <linearGradient id="rim-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".2" stop-color="#9cbbff"/>
      <stop offset=".52" stop-color="#554ac3"/>
      <stop offset="1" stop-color="#261459"/>
    </linearGradient>
    <filter id="highlight" x="-10%" y="-20%" width="125%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant=".55"
          specularExponent="18" lighting-color="#ffffff" result="light">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="light" in2="SourceAlpha" operator="in" result="shine"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shine"/>
      </feMerge>
    </filter>
    <text id="wordmark" x="500" y="171" text-anchor="middle"
      font-family="Librestile, Georgia, 'Times New Roman', serif"
      font-size="151" font-weight="900" letter-spacing="-5">BletchMAME</text>
  </defs>

  <g>
    <use href="#wordmark" fill="url(#wordmark-gradient)"
      stroke="#0a082d" stroke-width="19.2" stroke-linejoin="round"
      paint-order="stroke"/>
    <use href="#wordmark" fill="none" stroke="url(#rim-gradient)"
      stroke-width="4.8" stroke-linejoin="round"/>
    <use href="#wordmark" transform="translate(0 -2)" fill="none"
      stroke="#f4f3ff" stroke-opacity=".38" stroke-width="2"
      stroke-linejoin="round" filter="url(#highlight)"/>
  </g>
</svg>
