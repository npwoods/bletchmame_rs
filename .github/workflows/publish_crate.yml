name: Publish to crates.io

on:
  workflow_dispatch:
  push:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
        with:
            fetch-depth: 0

      # cargo publish verifies the packaged crate, which needs native build dependencies
      - name: Install Linux Dependencies
        run: |
          sudo apt update
          sudo apt install -y libxdo-dev libpango1.0-dev libgtk-3-dev libudev-dev libfontconfig1-dev pkg-config

      # Install Rust toolchain
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Install cargo-edit
      - name: Install cargo-edit
        shell: bash
        run: |
          cargo install cargo-edit

      # Determine version and set crate version
      - name: Determine version and set crate version
        run: |
          python scripts/set_crate_version.py

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # the version is generated by set_crate_version.py, so Cargo.toml and
          # Cargo.lock are expected to be dirty at this point
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            cargo publish --allow-dirty
          else
            cargo publish --allow-dirty --dry-run
          fi
