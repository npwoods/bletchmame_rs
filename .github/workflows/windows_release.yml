############################################
# BletchMAME Windows Release Github Action #
############################################

on:
    push:
        branches:
        - master
    pull_request:
        branches:
        - master

name: Windows Release

jobs:
  windows-release:
    name: Windows Release Build
    runs-on: windows-latest
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # Install Rust toolchain
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      # Caching
      - name: Caching
        uses: Swatinem/rust-cache@v2
        
      # Install cargo-edit
      - name: Install cargo-edit
        shell: bash
        run: |
          cargo install cargo-edit

      # Determine version and set crate version
      - name: Determine version and set crate version
        shell: bash
        run: |
          VERSION=$(git describe --tags | perl scripts/process_version.pl)
          CRATE_VERSION="$VERSION"
          if [[ "$CRATE_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            CRATE_VERSION="$CRATE_VERSION.0"
          fi
          cargo set-version "$CRATE_VERSION"
          VERSION_UNDERSCORES=${VERSION//./_}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_UNDERSCORES=$VERSION_UNDERSCORES" >> $GITHUB_ENV

      # Build
      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --locked --no-default-features --release

      # Install PanDoc
      - name: Install PanDoc
        shell: bash
        run: |
            mkdir -p deps
            curl -L -f "https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-windows-x86_64.zip" > deps/pandoc-windows-x86_64.zip
            7z x deps/pandoc-windows-x86_64.zip -odeps

      # Generate readme.html
      - name: Generate readme.html
        run: deps/pandoc-3.9/pandoc.exe README.md -o readme.html

      # Add WiX to PATH
      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wixRoot = Get-ChildItem "C:\Program Files (x86)" -Directory |
            Where-Object { $_.Name -like "WiX Toolset v*" } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $wixRoot) {
            Write-Error "WiX not found"
            exit 1
          }

          $wixBin = Join-Path $wixRoot.FullName "bin"
          echo $wixBin >> $env:GITHUB_PATH
          Write-Host "Using WiX from $wixBin"
    
      # Build MSI - Candle
      - name: Build MSI - Candle
        shell: bash
        run: candle -v bletchmame.wxs -dVERSION="$VERSION" -out bletchmame.wixobj
            
      # Build MSI - Light
      - name: Build MSI - Light
        run: light -v -ext WixUIExtension -ext WixUtilExtension bletchmame.wixobj -out BletchMAME.msi

      # Prepare Artifacts
      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p rel/msi/
          mkdir -p rel/zip/BletchMAME_${VERSION_UNDERSCORES}/
          mv BletchMAME.msi rel/msi/BletchMAME_${VERSION_UNDERSCORES}.msi
          cp ./target/release/BletchMAME.exe rel/zip/BletchMAME_${VERSION_UNDERSCORES}/
          cp readme.html rel/zip/BletchMAME_${VERSION_UNDERSCORES}/
          cp -r plugins rel/zip/BletchMAME_${VERSION_UNDERSCORES}/

      # Upload build output MSI
      - name: Upload build output MSI
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/master'
        with:
          name: BletchMAME_${{ env.VERSION_UNDERSCORES }}.msi
          path: rel/msi/

      # Upload build output ZIP
      - name: Upload build output ZIP
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/master'
        with:
          name: BletchMAME_${{ env.VERSION_UNDERSCORES }}.zip
          path: rel/zip/
