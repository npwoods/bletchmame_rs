############################################
# BletchMAME Windows Release Github Action #
############################################

on:
    push:
        branches:
        - master
    pull_request:
        branches:
        - master

name: Windows Release

jobs:
  windows-release:
    name: Windows Release Build
    runs-on: windows-latest
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # Install Rust toolchain
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      # Caching
      - name: Caching
        uses: Swatinem/rust-cache@v2
        
      # Install cargo-edit
      - name: Install cargo-edit
        shell: bash
        run: |
          cargo install cargo-edit

      # Determine version and set crate version
      - name: Determine version and set crate version
        run: |
          python scripts/set_crate_version.py

      # Build
      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --locked --no-default-features --release

      # Install PanDoc
      - name: Install PanDoc
        shell: bash
        run: |
            mkdir -p deps
            curl -L -f "https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-windows-x86_64.zip" > deps/pandoc-windows-x86_64.zip
            7z x deps/pandoc-windows-x86_64.zip -odeps
            echo "$GITHUB_WORKSPACE/deps/pandoc-3.9" >> "$GITHUB_PATH"

      # Add WiX to PATH
      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wixRoot = Get-ChildItem "C:\Program Files (x86)" -Directory |
            Where-Object { $_.Name -like "WiX Toolset v*" } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $wixRoot) {
            Write-Error "WiX not found"
            exit 1
          }

          $wixBin = Join-Path $wixRoot.FullName "bin"
          echo $wixBin >> $env:GITHUB_PATH
          Write-Host "Using WiX from $wixBin"
    
      # Build Windows artifacts
      - name: Build Windows artifacts
        id: build-artifacts
        shell: bash
        run: |
          ARTIFACT_NAME=$(python scripts/release_windows_artifacts.py)
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      # Upload build output MSI
      - name: Upload build output MSI
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/master'
        with:
          name: ${{ env.ARTIFACT_NAME }}.msi
          path: rel/msi/

      # Upload build output ZIP
      - name: Upload build output ZIP
        uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/master'
        with:
          name: ${{ env.ARTIFACT_NAME }}.zip
          path: rel/zip/
