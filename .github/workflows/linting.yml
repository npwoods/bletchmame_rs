########################################
# BletchMAME Linting Github Action     #
########################################

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

name: Linting (Clippy and Rustfmt)

jobs:
  clippy:
    name: Clippy
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: ["", "--all-features"]
        exclude:
          - os: windows-latest
            features: "--all-features"
    runs-on: ${{ matrix.os }}
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      # Install Rust toolchain
      - uses: dtolnay/rust-toolchain@stable

      # Install Rust Components
      - name: Install Rust Components
        run: rustup component add clippy

      # Install Linux Dependencies
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libxdo-dev libpango1.0-dev libgtk-3-dev libudev-dev

      # Install Qt
      - name: Install Qt
        if: matrix.features == '--all-features'
        uses: jurplel/install-qt-action@v4          

      # Caching
      - name: Caching
        uses: Swatinem/rust-cache@v2

      # Run Clippy
      - name: Clippy
        run: cargo clippy --locked ${{ matrix.features }} --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      # Install Rust toolchain
      - uses: dtolnay/rust-toolchain@stable

      # Install Rust Components
      - run: rustup component add rustfmt

      # Rustfmt
      - run: cargo fmt --all -- --check
